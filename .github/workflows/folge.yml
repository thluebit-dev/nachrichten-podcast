# Vertont neu eingereichte Sprechtexte und stellt die Folgen auf die Homepage.
# Auslöser: ein neuer Sprechtext unter skripte/ (von der Claude-Routine gepusht)
# oder von Hand über „Run workflow“. Jeder Lauf holt alle ausstehenden Folgen der
# letzten 14 Tage nach, damit auch übersprungene oder abgebrochene Läufe aufgeholt werden.
name: Folge vertonen und veröffentlichen

on:
  push:
    branches: [main]
    paths: ["skripte/*.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folge
  cancel-in-progress: false

jobs:
  folge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ausstehende Folgen bestimmen
        id: offen
        run: |
          if git fetch --depth=1 origin gh-pages; then
            git show FETCH_HEAD:folgen.json > /tmp/folgen.json || echo "[]" > /tmp/folgen.json
          else
            echo "[]" > /tmp/folgen.json
          fi
          DATEN=$(node ausstehende_folgen.mjs /tmp/folgen.json | tr '\n' ' ')
          echo "daten=$DATEN" >> "$GITHUB_OUTPUT"
          echo "Ausstehend: ${DATEN:-keine}"

      - name: Vertonen und veröffentlichen
        if: steps.offen.outputs.daten != ''
        run: |
          for D in ${{ steps.offen.outputs.daten }}; do
            echo "::group::Folge vom $D"
            ok=0
            for versuch in 1 2 3; do
              if node vertonen.mjs "skripte/$D.txt" "folge-$D.mp3"; then ok=1; break; fi
              echo "Vertonen, Versuch $versuch fehlgeschlagen – neuer Versuch in 30 s"
              sleep 30
            done
            [ "$ok" = 1 ] || { echo "::error::Folge vom $D konnte nicht vertont werden"; exit 1; }
            bash seite_aktualisieren.sh "folge-$D.mp3" "$D" "skripte/$D.beschreibung.txt"
            echo "::endgroup::"
          done
