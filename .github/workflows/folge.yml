# Vertont einen neu eingereichten Sprechtext und stellt die Folge auf die Homepage.
# Auslöser: ein neuer Sprechtext unter skripte/ (von der Claude-Routine gepusht)
# oder von Hand über „Run workflow“ mit einem Datum.
name: Folge vertonen und veröffentlichen

on:
  push:
    branches: [main]
    paths: ["skripte/*.txt"]
  workflow_dispatch:
    inputs:
      datum:
        description: "Datum der Folge (JJJJ-MM-TT), leer = neuester Sprechtext"
        required: false

permissions:
  contents: write

concurrency:
  group: folge
  cancel-in-progress: false

jobs:
  folge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Datum bestimmen
        id: datum
        run: |
          D="${{ github.event.inputs.datum }}"
          if [ -z "$D" ]; then
            D=$(ls skripte/ | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.txt$' | sort | tail -1 | cut -c1-10)
          fi
          test -f "skripte/$D.txt" || { echo "Kein Sprechtext skripte/$D.txt"; exit 1; }
          echo "datum=$D" >> "$GITHUB_OUTPUT"
          echo "Folge vom $D"

      - name: Vertonen (bis zu 3 Versuche)
        run: |
          D="${{ steps.datum.outputs.datum }}"
          for versuch in 1 2 3; do
            node vertonen.mjs "skripte/$D.txt" folge.mp3 && exit 0
            echo "Versuch $versuch fehlgeschlagen, neuer Versuch in 30 s"
            sleep 30
          done
          exit 1

      - name: Homepage aktualisieren
        run: |
          D="${{ steps.datum.outputs.datum }}"
          bash seite_aktualisieren.sh folge.mp3 "$D" "skripte/$D.beschreibung.txt"
